<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Timer</title>
<style>
  :root{
    --bg1:#eaf4ff; --bg2:#f6ecff; --ink:#2b2d42; --soft:#6b6f8a;
    --ring:#ffffff; --accent:#ff9f6b; --accent2:#7bc8ff; --good:#6fcf97;
    --card:#ffffffd9;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;padding:24px;gap:22px;overflow:hidden;
  }
  h1{margin:0;font-size:clamp(22px,3vw,34px);letter-spacing:.5px}
  .stage{display:flex;flex-direction:column;align-items:center;gap:18px}

  /* dog mascot */
  .dogwrap{width:clamp(120px,16vw,200px);height:clamp(120px,16vw,200px);
    border-radius:50%;overflow:hidden;background:#fff;
    border:8px solid #fff;box-shadow:0 12px 30px #0002;
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .dogwrap img{width:100%;height:100%;object-fit:cover}
  .dogwrap .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:14px;color:var(--soft);padding:10px;background:#f3f6ff}

  /* timer ring */
  .ringbox{position:relative;width:clamp(260px,40vw,440px);height:clamp(260px,40vw,440px)}
  svg{transform:rotate(-90deg);width:100%;height:100%}
  .track{fill:none;stroke:#ffffff;stroke-width:22}
  .prog{fill:none;stroke:var(--accent);stroke-width:22;stroke-linecap:round;
    transition:stroke-dashoffset .3s linear,stroke .4s}
  .readout{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px}
  .time{font-size:clamp(54px,11vw,120px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .msg{font-size:clamp(16px,2.4vw,26px);color:var(--soft);min-height:1.2em}

  /* controls */
  .presets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .pill{border:none;background:var(--card);color:var(--ink);font:inherit;font-weight:700;
    font-size:clamp(15px,2vw,20px);padding:12px 20px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 12px #0001;transition:transform .08s,background .2s}
  .pill:hover{transform:translateY(-2px)}
  .pill.sel{background:var(--accent2);color:#083a56}
  .custom{display:flex;gap:8px;align-items:center}
  .custom input{width:84px;font:inherit;font-size:18px;text-align:center;padding:10px;
    border:2px solid #fff;border-radius:14px;background:#fff;color:var(--ink)}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
  .big{font-size:clamp(18px,2.4vw,24px);font-weight:800;padding:16px 34px;border-radius:18px;
    border:none;cursor:pointer;box-shadow:0 6px 16px #0002;transition:transform .08s,filter .2s}
  .big:hover{transform:translateY(-2px)}
  .start{background:var(--good);color:#063d22}
  .pause{background:#ffd66b;color:#6b4e00}
  .reset{background:#fff;color:var(--soft)}
  .mini{background:#fff;color:var(--soft);border:none;font:inherit;font-weight:700;
    padding:10px 16px;border-radius:14px;cursor:pointer;box-shadow:0 4px 12px #0001}
  .tools{position:fixed;top:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
  .tools .mini{font-size:13px;padding:8px 12px}
  input[type=file]{display:none}
  #yt{position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0}
  .credit{position:fixed;bottom:10px;font-size:12px;color:#9aa0bf}
</style>
</head>
<body>
  <div class="tools">
    <button class="mini" id="dogBtn">Change dog</button>
    <button class="mini" id="lofiBtn">Lofi music: off</button>
    <button class="mini" id="musicBtn">Load my music</button>
    <button class="mini" id="fsBtn">Fullscreen</button>
  </div>

  <h1 id="title">Our Class Timer</h1>

  <div class="stage">
    <div class="dogwrap" id="dogWrap" title="Click to add a dog photo">
      <div class="hint" id="dogHint">Click to add<br>your dog photo</div>
    </div>

    <div class="ringbox">
      <svg viewBox="0 0 320 320">
        <circle class="track" cx="160" cy="160" r="140"></circle>
        <circle class="prog" id="prog" cx="160" cy="160" r="140"></circle>
      </svg>
      <div class="readout">
        <div class="time" id="time">30:00</div>
        <div class="msg" id="msg">Pick a time and press Start</div>
      </div>
    </div>
  </div>

  <div class="presets" id="presets">
    <button class="pill" data-min="5">5 min</button>
    <button class="pill" data-min="10">10 min</button>
    <button class="pill" data-min="15">15 min</button>
    <button class="pill" data-min="20">20 min</button>
    <button class="pill sel" data-min="30">30 min</button>
    <button class="pill" data-min="45">45 min</button>
    <button class="pill" data-min="60">60 min</button>
    <div class="custom">
      <input id="customMin" type="number" min="1" max="180" placeholder="min">
      <button class="pill" id="setCustom">Set</button>
    </div>
  </div>

  <div class="row">
    <button class="big start" id="startBtn">Start</button>
    <button class="big pause" id="pauseBtn" style="display:none">Pause</button>
    <button class="big reset" id="resetBtn">Reset</button>
    <button class="mini" id="plus1">+1 min</button>
  </div>

  <input type="file" id="dogFile" accept="image/*">
  <input type="file" id="musicFile" accept="audio/*">
  <audio id="localAudio" loop></audio>
  <div id="yt"></div>
  <div class="credit">Tip: add a dog photo once and it stays. Press Fullscreen for the projector.</div>

<script>
(function(){
  const R=140, CIRC=2*Math.PI*R;
  const prog=document.getElementById('prog');
  prog.style.strokeDasharray=CIRC;
  prog.style.strokeDashoffset=0;

  const timeEl=document.getElementById('time');
  const msgEl=document.getElementById('msg');
  const startBtn=document.getElementById('startBtn');
  const pauseBtn=document.getElementById('pauseBtn');
  const resetBtn=document.getElementById('resetBtn');
  const presets=document.getElementById('presets');

  let totalSec=30*60, leftSec=30*60, running=false, tick=null, endAt=0;

  const happy=["You've got this!","Keep going!","Nice focus!","Great work!","Almost there!"];

  function fmt(s){const m=Math.floor(s/60),ss=s%60;return m+':'+String(ss).padStart(2,'0');}
  function color(frac){ // frac left: 1 -> green-ish start, shift to orange then red
    if(frac>0.5) return getComputedStyle(document.documentElement).getPropertyValue('--good');
    if(frac>0.2) return '#ff9f6b';
    return '#ff6b6b';
  }
  function render(){
    timeEl.textContent=fmt(leftSec);
    const frac=totalSec? leftSec/totalSec : 0;
    prog.style.strokeDashoffset=CIRC*(1-frac);
    prog.style.stroke=color(frac);
  }
  function setDuration(min){
    totalSec=leftSec=Math.max(1,Math.round(min*60));
    running=false; clearInterval(tick); pauseBtn.style.display='none'; startBtn.style.display='';
    msgEl.textContent='Ready! Press Start'; render();
  }
  function loop(){
    leftSec=Math.max(0,Math.round((endAt-Date.now())/1000));
    render();
    if(leftSec<=0){ done(); }
    else if(leftSec%30===0){ msgEl.textContent=happy[Math.floor(Math.random()*happy.length)]; }
  }
  function start(){
    if(running||leftSec<=0) return;
    running=true; endAt=Date.now()+leftSec*1000;
    tick=setInterval(loop,250);
    startBtn.style.display='none'; pauseBtn.style.display='';
    msgEl.textContent='Timer is going!';
  }
  function pause(){
    running=false; clearInterval(tick);
    startBtn.style.display=''; pauseBtn.style.display='none';
    startBtn.textContent='Resume'; msgEl.textContent='Paused';
  }
  function reset(){
    running=false; clearInterval(tick); leftSec=totalSec;
    startBtn.style.display=''; pauseBtn.style.display='none';
    startBtn.textContent='Start'; msgEl.textContent='Ready! Press Start'; render();
  }
  function done(){
    running=false; clearInterval(tick); leftSec=0; render();
    startBtn.style.display=''; pauseBtn.style.display='none'; startBtn.textContent='Start';
    msgEl.textContent='⭐ Time is up! Great job! ⭐';
    chime(); celebrate();
  }

  // gentle chime (no file needed)
  function chime(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC();
      const notes=[523.25,659.25,783.99,1046.5]; // C E G C, soft
      notes.forEach((f,i)=>{
        const o=ac.createOscillator(),g=ac.createGain();
        o.type='sine'; o.frequency.value=f;
        const t=ac.currentTime+i*0.18;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(0.22,t+0.04);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.95);
      });
    }catch(e){}
  }
  function celebrate(){
    const n=28;
    for(let i=0;i<n;i++){
      const d=document.createElement('div');
      d.textContent=['🎉','⭐','🐾','✨','🎈'][i%5];
      d.style.cssText='position:fixed;left:'+Math.random()*100+'vw;top:-40px;font-size:'+(20+Math.random()*24)+'px;z-index:50;pointer-events:none;transition:transform 2.6s ease-in, opacity 2.6s';
      document.body.appendChild(d);
      requestAnimationFrame(()=>{d.style.transform='translateY(110vh) rotate('+(Math.random()*720-360)+'deg)';d.style.opacity='0';});
      setTimeout(()=>d.remove(),2700);
    }
  }

  // presets
  presets.addEventListener('click',e=>{
    const b=e.target.closest('.pill[data-min]'); if(!b) return;
    [...presets.querySelectorAll('.pill')].forEach(p=>p.classList.remove('sel'));
    b.classList.add('sel'); startBtn.textContent='Start'; setDuration(+b.dataset.min);
    localStorage.setItem('ct_min',b.dataset.min);
  });
  document.getElementById('setCustom').addEventListener('click',()=>{
    const v=+document.getElementById('customMin').value;
    if(v>0){ [...presets.querySelectorAll('.pill')].forEach(p=>p.classList.remove('sel'));
      startBtn.textContent='Start'; setDuration(v); localStorage.setItem('ct_min',v);}
  });
  document.getElementById('plus1').addEventListener('click',()=>{
    leftSec+=60; totalSec=Math.max(totalSec,leftSec);
    if(running) endAt+=60000; render();
  });

  startBtn.addEventListener('click',start);
  pauseBtn.addEventListener('click',pause);
  resetBtn.addEventListener('click',reset);

  // dog photo (persisted)
  const dogWrap=document.getElementById('dogWrap'), dogHint=document.getElementById('dogHint');
  const dogFile=document.getElementById('dogFile');
  function showDog(url){
    dogWrap.innerHTML=''; const img=new Image(); img.src=url; dogWrap.appendChild(img);
  }
  const saved=localStorage.getItem('ct_dog'); if(saved) showDog(saved);
  function pickDog(){ dogFile.click(); }
  dogWrap.addEventListener('click',pickDog);
  document.getElementById('dogBtn').addEventListener('click',pickDog);
  dogFile.addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ try{localStorage.setItem('ct_dog',r.result);}catch(_){ } showDog(r.result); }; r.readAsDataURL(f);
  });
  // drag-drop a dog photo anywhere
  window.addEventListener('dragover',e=>e.preventDefault());
  window.addEventListener('drop',e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(x=>x.type.startsWith('image/'));
    if(f){const r=new FileReader();r.onload=()=>{try{localStorage.setItem('ct_dog',r.result);}catch(_){}showDog(r.result);};r.readAsDataURL(f);}});

  // lofi via YouTube (Lofi Girl)
  let lofiOn=false; const lofiBtn=document.getElementById('lofiBtn'); const yt=document.getElementById('yt');
  lofiBtn.addEventListener('click',()=>{
    lofiOn=!lofiOn;
    if(lofiOn){ yt.innerHTML='<iframe width="1" height="1" src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1" allow="autoplay" frameborder="0"></iframe>'; lofiBtn.textContent='Lofi music: on'; }
    else { yt.innerHTML=''; lofiBtn.textContent='Lofi music: off'; }
  });

  // load own music file (loops)
  const localAudio=document.getElementById('localAudio'); const musicFile=document.getElementById('musicFile');
  document.getElementById('musicBtn').addEventListener('click',()=>musicFile.click());
  musicFile.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;
    localAudio.src=URL.createObjectURL(f); localAudio.play(); document.getElementById('musicBtn').textContent='My music: playing';});

  // fullscreen
  document.getElementById('fsBtn').addEventListener('click',()=>{
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  // restore last duration
  const lastMin=+localStorage.getItem('ct_min')||30;
  [...presets.querySelectorAll('.pill[data-min]')].forEach(p=>p.classList.toggle('sel',+p.dataset.min===lastMin));
  setDuration(lastMin); msgEl.textContent='Pick a time and press Start';

  // keyboard: space start/pause
  window.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault(); running?pause():start();} });
})();
</script>
</body>
</html>
